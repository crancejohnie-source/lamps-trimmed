<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ground:#0E1526;--panel:#141D33;--line:#2A3650;--text:#F3EFE6;--muted:#C4BEB0;--dim:#9A948A;--gold:#D9A441;--blue:#8FB4E6;--gray:#B5B5B5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px}
a{color:var(--gold)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--gold);color:#0E1526;padding:8px 12px;border-radius:6px;z-index:20}
.skip:focus{left:8px}
header{position:sticky;top:0;z-index:10;background:rgba(14,21,38,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand .t{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;line-height:1}
.brand .s{font-size:13px;color:var(--gold);font-weight:600}
.test{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#0E1526;background:var(--gold);padding:4px 8px;border-radius:4px;font-weight:700}
nav{display:flex;gap:2px;padding:0 10px 8px;max-width:760px;margin:0 auto}
nav a{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:9px 4px;border-radius:8px;border:1px solid transparent}
nav a.on{color:var(--text);border-color:var(--line);background:var(--panel)}
main{max-width:760px;margin:0 auto;padding:18px 18px 70px}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.1;margin:0 0 10px}
h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;line-height:1.15;margin:26px 0 10px}
h3{font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin:22px 0 8px}
p{line-height:1.6;margin:0 0 12px}
.muted{color:var(--muted)}.dim{color:var(--dim);font-size:14px}
.verse{font-family:'Cormorant Garamond',serif;font-size:22px;line-height:1.4;margin:0 0 6px}
.verse .n{color:var(--gold);font-size:13px;font-family:Inter,sans-serif;font-weight:600;vertical-align:super;margin-right:3px}
.ref{font-size:14px;font-weight:600;color:var(--gold);margin-bottom:14px;font-style:italic}
.ref a{text-decoration:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
.rule{height:1px;background:var(--line);margin:16px 0}
.badge{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:10px;border:2px solid;font-weight:700;font-size:13px;line-height:1;white-space:nowrap}
.badge small{font-weight:500;font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.A{color:var(--gold);border-color:var(--gold)}.B{color:var(--blue);border-color:var(--blue)}.C{color:var(--gray);border-color:var(--gray)}.S{color:var(--muted);border-color:var(--line)}
.row{display:flex;gap:14px;align-items:flex-start}
ol,ul{padding-left:20px;line-height:1.6}
.list a{display:block;color:var(--text);text-decoration:none;padding:14px 0;border-bottom:1px solid var(--line)}
.list a small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.tag{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
.block{border-left:3px solid var(--line);padding:4px 14px;margin:14px 0}
.block.scripture{border-color:var(--gold)}.block.position{border-color:#B98CFF}.block.application{border-color:#7FC8A9}.block.challenge{border-color:#E08A8A}
.block .tag{display:block;margin-bottom:6px}
select,button,input,textarea{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:44px}
button.primary{background:var(--gold);color:#0E1526;border-color:var(--gold);font-weight:700;cursor:pointer}
button.ghost{cursor:pointer}
.sel{display:flex;gap:8px;margin:10px 0 18px}.sel select{flex:1}
.v{display:flex;gap:10px;line-height:1.6;margin:0 0 8px;scroll-margin-top:120px}
.v b{color:var(--gold);font-weight:600;min-width:26px;font-size:13px;padding-top:4px}
.v.hl{background:rgba(217,164,65,.12);border-radius:6px;padding:4px 6px;margin-left:-6px}
.foot{color:var(--dim);font-size:13px;line-height:1.5;margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
.center{text-align:center}
.big{font-size:17px;line-height:1.65}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.src a{word-break:break-all}
.hero{margin:-18px -18px 18px;position:relative}
.hero img{display:block;width:100%;height:auto;max-height:42vh;object-fit:cover;object-position:center 70%}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(180deg,rgba(14,21,38,0),rgba(14,21,38,1))}
@media(min-width:760px){.hero{margin:-18px 0 18px}.hero img{border-radius:14px}}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.cta a{display:inline-block;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700;min-height:44px}
.cta a.gold{background:var(--gold);color:#0E1526}.cta a.line{border:1px solid var(--line);color:var(--text)}
form{display:flex;flex-direction:column;gap:10px;margin:10px 0}
form input,form textarea{width:100%}
.ok{color:#7FC8A9;font-weight:600}
.status{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin:6px 0 14px}
.status span{border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.share{display:flex;gap:8px;margin:18px 0}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <div class="bar">
    <a class="brand" href="#home" aria-label="Lamps Trimmed home">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c-1 2.5-3 4-3 6.5a3 3 0 0 0 6 0C15 7 13 5.5 12 3z"/><path d="M7 14h10l-1 4H8l-1-4z"/><path d="M9 18v2h6v-2"/></svg>
      <span><span class="t">Lamps Trimmed</span><br><span class="s">We watch the season. We never set dates.</span></span>
    </a>
    <span id="testbadge" class="test" hidden>Test</span>
  </div>
  <nav id="nav" aria-label="Sections">
    <a href="#today">Today</a><a href="#watch">Watch</a><a href="#study">Study</a><a href="#bible">Bible</a><a href="#about">About</a>
  </nav>
</header>
<main id="main" tabindex="-1"><div class="empty">Loading</div></main>

<script>
const SB = { url: "https://mnswgrxctbzxopsuchtl.supabase.co", key: "sb_publishable_NgfqMD9GTkylw4FF9oywLg_8nXwOO_a" };
const BOOKS_CACHE = {};
let SETTINGS = {};

async function q(path){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
  try{
    const r = await fetch(SB.url + "/rest/v1/" + path, { headers: { apikey: SB.key, Authorization: "Bearer " + SB.key }, signal: ctl.signal });
    if(!r.ok) throw new Error("We could not reach the database just now.");
    return r.json();
  } finally { clearTimeout(t); }
}
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function safeUrl(u){ return /^https?:\/\//i.test(u||"") ? u : "#"; }
function s(k){ return SETTINGS[k] ?? ""; }
const GRADE = { A: ["Strong connection","Strong"], B: ["Plausible connection","Plausible"], C: ["Speculative","Speculative"] };

// ---------- scripture ----------
async function getBooks(){
  if(!BOOKS_CACHE.list) BOOKS_CACHE.list = await q("books?order=id&select=id,name,testament,chapters");
  return BOOKS_CACHE.list;
}
function parseRef(ref){
  ref = ref.trim();
  const books = BOOKS_CACHE.list || [];
  let m = ref.match(/^([1-3]?\s?[A-Za-z ]+?)\s(\d+)(?::(\d+))?(?:-(?:(\d+):)?(\d+))?$/);
  if(!m) return null;
  const b = books.find(x => x.name.toLowerCase() === m[1].trim().toLowerCase()); if(!b) return null;
  const c1 = +m[2], v1 = m[3] ? +m[3] : 1;
  let c2 = c1, v2 = m[3] ? +m[3] : 999;
  if(m[5] && m[4]){ c2 = +m[4]; v2 = +m[5]; }
  else if(m[5]){ if(m[3]) v2 = +m[5]; else { c2 = +m[5]; v2 = 999; } }
  return { book: b, c1, v1, c2, v2, label: ref };
}
async function verses(ref){
  await getBooks();
  const p = parseRef(ref); if(!p) return { p:null, vs:[] };
  let vs;
  if(p.c1 === p.c2) vs = await q(`verses?translation=eq.KJV&book_id=eq.${p.book.id}&chapter=eq.${p.c1}&verse=gte.${p.v1}&verse=lte.${p.v2}&order=verse&select=chapter,verse,text`);
  else vs = await q(`verses?translation=eq.KJV&book_id=eq.${p.book.id}&chapter=gte.${p.c1}&chapter=lte.${p.c2}&order=chapter,verse&select=chapter,verse,text`).then(a => a.filter(v => !(v.chapter===p.c1 && v.verse<p.v1) && !(v.chapter===p.c2 && v.verse>p.v2)));
  return { p, vs };
}
function scriptureBlock(r){
  if(!r.p || !r.vs.length) return "";
  const link = `#bible-${r.p.book.id}-${r.p.c1}-${r.p.v1}`;
  const html = r.vs.map(v => `<span class="n">${v.verse}</span>${esc(v.text)} `).join("");
  return `<div class="block scripture"><span class="tag">Scripture</span><p class="verse">${html}</p><div class="ref"><a href="${link}">${esc(r.p.label)} (KJV)</a></div></div>`;
}
async function refLinkify(text){
  await getBooks();
  const names = BOOKS_CACHE.list.map(b => b.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
  const re = new RegExp(`\\b(${names})\\s(\\d+)(?::(\\d+)(?:-\\d+(?::\\d+)?)?)?`, "g");
  return esc(text).replace(re, (m, bn, ch, vs) => { const b = BOOKS_CACHE.list.find(x => x.name === bn); return b ? `<a href="#bible-${b.id}-${ch}-${vs||1}">${m}</a>` : m; });
}
async function renderBody(body){
  const parts = body.trim().split(/\n\s*\n/);
  const out = [];
  for(const part of parts){
    const t = part.trim();
    if(t.startsWith("## ")) out.push(`<h2>${esc(t.slice(3))}</h2>`);
    else if(t.startsWith("> ")) out.push(scriptureBlock(await verses(t.slice(2))));
    else if(t.startsWith("POSITION:")) out.push(`<div class="block position"><span class="tag">This app's position</span><p>${await refLinkify(t.slice(9).trim())}</p></div>`);
    else if(t.startsWith("APPLICATION:")) out.push(`<div class="block application"><span class="tag">Be ready</span><p>${await refLinkify(t.slice(12).trim())}</p></div>`);
    else out.push(`<p class="big">${await refLinkify(t)}</p>`);
  }
  return out.join("");
}

function badge(g){ if(!g) return `<span class="badge S">Study<small>no grade</small></span>`; const [long, short] = GRADE[g]; return `<span class="badge ${g}" role="img" aria-label="${long}. Describes the connection, not the timing.">${short}<small>connection</small></span>`; }
function dateStr(d){ return d ? new Date(d).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric",timeZone:"America/Chicago"}) : ""; }
function hope(){ return `<div class="block application"><span class="tag">Be ready</span><p>${esc(s("hope_line"))} <a href="#study-watch-and-be-ready">Watch and be ready</a></p></div>`; }
function shareBtn(title, url){
  return `<div class="share"><button class="ghost" onclick="doShare(${JSON.stringify(title)},${JSON.stringify(url)})">Share</button><button class="ghost" onclick="copyText(${JSON.stringify(url)},this)">Copy link</button></div>`;
}
window.doShare = async (title, url) => { try{ if(navigator.share) await navigator.share({ title, url }); else await copyText(url); }catch(e){} };
window.copyText = async (t, btn) => { try{ await navigator.clipboard.writeText(t); if(btn){ btn.textContent = "Copied"; setTimeout(()=>btn.textContent="Copy link",1500);} }catch(e){} };
const BASE = location.origin + location.pathname;

// ---------- views ----------
async function home(){
  const [fig, v36, brand, parable] = await Promise.all([verses("Matthew 24:32-34"), verses("Matthew 24:36"), verses(s("brand_verse_ref")), verses("Matthew 25:1-13")]);
  return `
  <div class="hero"><img src="hero.jpg" alt="A clay oil lamp burning on a stone wall above olive trees, with the walls of Jerusalem at dusk"></div>
  <h1>Keep your lamp burning.</h1>
  <p class="big">${esc(s("home_promise"))}</p>
  <div class="cta"><a class="gold" href="#today">This week's watch</a><a class="line" href="#study-why-we-watch">Why we never set dates</a></div>
  <h3>Learn a parable of the fig tree</h3>
  ${scriptureBlock(fig)}
  ${scriptureBlock(v36)}
  <p class="dim">${esc(s("front_luke_note"))}</p>
  <div class="card"><div class="tag">What happened</div><p class="big" style="margin-top:8px">${esc(s("front_fact"))}</p><p class="dim">Source: ${esc(s("front_fact_source"))}</p></div>
  <div class="block position"><span class="tag">This app's position</span><p class="big">${esc(s("front_line"))}</p><p class="dim">${esc(s("front_editorial_note"))}</p></div>
  <h3>Let your lights be burning</h3>
  ${scriptureBlock(brand)}
  <details><summary class="dim" style="cursor:pointer">Read the ten virgins, Matthew 25:1-13</summary><div style="margin-top:12px">${parable.vs.map(v => `<div class="v"><b>${v.verse}</b><span>${esc(v.text)}</span></div>`).join("")}</div></details>
  ${hope()}
  <h3>Get the weekly watch</h3>
  ${subscribeForm()}
  <div class="rule"></div>
  <p class="muted">${esc(s("editorial_lens"))}</p>`;
}

function subscribeForm(){
  return `<form onsubmit="return sendInbox(event,'subscribe')"><input type="email" name="email" placeholder="Your email" required aria-label="Email"><input class="hp" name="website" tabindex="-1" autocomplete="off"><button class="primary" type="submit">Send me the watch</button><p class="dim">One email a week. Unsubscribe any time. Nothing else, ever.</p><p class="ok" data-ok hidden>You're on the list.</p></form>`;
}
window.sendInbox = async (e, kind) => {
  e.preventDefault(); const f = e.target; const fd = new FormData(f);
  const payload = { kind, email: fd.get("email") || "", body: fd.get("body") || "", item_id: fd.get("item_id") || null, website: fd.get("website") || "" };
  const btn = f.querySelector("button"); btn.disabled = true;
  try{
    const r = await fetch(SB.url + "/functions/v1/inbox", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
    if(!r.ok) throw new Error();
    f.querySelector("[data-ok]").hidden = false; f.querySelectorAll("input,textarea").forEach(i => i.value = "");
  }catch(err){ alertInline(f, "That did not go through. Try again in a minute."); }
  btn.disabled = false; return false;
};
function alertInline(f, msg){ let p = f.querySelector("[data-err]"); if(!p){ p = document.createElement("p"); p.setAttribute("data-err",""); p.className="dim"; f.appendChild(p);} p.textContent = msg; }

async function today(){
  const items = await q("items?status=eq.app_published&active=eq.true&expires_at=gt." + new Date().toISOString() + "&card_kind=eq.news_watch&order=graded_at.desc&limit=1&select=*,themes(id,label,card_line)");
  const prev = await q("items?status=in.(app_published,retracted)&order=graded_at.desc&limit=8&select=id,headline,grade,graded_at,status,card_kind");
  let body;
  if(items.length) body = await itemView(items[0], true);
  else {
    const r = await verses("Mark 13:33-37");
    body = `<div class="card"><div class="tag">No verified news update this week</div><p style="margin-top:8px">Nothing met the bar for sources and context. The Word still stands.</p></div>${scriptureBlock(r)}${hope()}`;
  }
  const others = prev.filter(p => !items.length || p.id !== items[0].id);
  return `<h1>This week's watch</h1><p class="dim">${esc(s("today_intro"))} <a href="#about-how-a-card-is-made">How a card is made</a></p>` + body +
    (others.length ? `<h2>Previous</h2><div class="list">${others.map(p => `<a href="#item-${p.id}"><strong>${esc(p.headline)}</strong><small>${dateStr(p.graded_at)}${p.status==="retracted" ? " · Retracted" : ""}</small></a>`).join("")}</div>` : "") +
    `<h3>Next watch</h3><p class="muted">Sunday morning, 5:00 AM Central. A Scripture card every day.</p>${subscribeForm()}`;
}

async function itemPage(id){
  const r = await q(`items?id=eq.${id}&status=in.(app_published,retracted)&select=*,themes(id,label,card_line)`);
  if(!r.length) return `<div class="empty">That item is not available.</div>`;
  return await itemView(r[0], true);
}

async function itemView(it, showDate){
  const srcIds = [...new Set((it.facts||[]).flatMap(f => f.source_ids||[]))];
  const srcs = srcIds.length ? await q(`sources?id=in.(${srcIds.join(",")})&select=id,publisher,title,canonical_url,published_at`) : [];
  const byId = Object.fromEntries(srcs.map(x => [x.id, x]));
  const [passage, unit, closing] = await Promise.all([verses(it.passage), it.unit_ref ? verses(it.unit_ref) : {p:null,vs:[]}, verses(it.closing_verse)]);
  const url = BASE + "#item-" + it.id;
  const expired = it.expires_at && new Date(it.expires_at) < new Date();
  return `
  ${it.status === "retracted" ? `<div class="card" style="border-color:#E08A8A"><div class="tag">Correction - ${dateStr(it.updated_at)}</div><p style="margin-top:6px">This item was retracted. ${esc(it.correction_reason||"")}</p></div>` : ""}
  ${expired ? `<p class="dim">Past its review period. Kept as dated history.</p>` : ""}
  <div class="status"><span>${showDate ? dateStr(it.graded_at) : ""}</span>${it.themes ? `<span><a href="#watch-${it.themes.id}">${esc(it.themes.label)}</a></span>` : ""}${it.verified_at ? `<span>Verified ${dateStr(it.verified_at)}</span>` : ""}${it.rechecked_at ? `<span>Rechecked ${dateStr(it.rechecked_at)}</span>` : ""}</div>
  <div class="row" style="margin:6px 0 4px"><div style="flex:1"><h2 style="margin:0">${esc(it.headline)}</h2></div>${badge(it.grade)}</div>
  <p class="dim">${esc(GRADE[it.grade] ? GRADE[it.grade][0] : "")}. Describes the connection to the passage, not the timing.</p>
  ${scriptureBlock(passage)}
  ${unit.vs.length ? `<details><summary class="dim" style="cursor:pointer">Read the whole passage, ${esc(it.unit_ref)}</summary><div style="margin-top:10px">${unit.vs.map(v => `<div class="v"><b>${v.verse}</b><span>${esc(v.text)}</span></div>`).join("")}</div></details>` : ""}
  <div class="block"><span class="tag">In context</span><p>${await refLinkify(it.context)}</p></div>
  <div class="block"><span class="tag">What is happening</span><ol>${(it.facts||[]).map(f => `<li>${esc(f.text)} ${(f.source_ids||[]).map(id => byId[id] ? `<span class="dim">[${esc(byId[id].publisher)}]</span>` : "").join(" ")}</li>`).join("")}</ol></div>
  <div class="block"><span class="tag">Why this grade</span><p>${await refLinkify(it.why_grade)}</p></div>
  ${it.challenge ? `<div class="block challenge"><span class="tag">The case against this connection</span><p>${await refLinkify(it.challenge)}</p></div>` : ""}
  <div class="card"><div class="tag">What would strengthen this</div><p style="margin:6px 0 10px">${esc(it.move_up)}</p><div class="tag">What would weaken it</div><p style="margin:6px 0 0">${esc(it.move_down)}</p></div>
  ${it.themes && it.themes.card_line ? `<p class="dim">${esc(it.themes.card_line)}</p>` : ""}
  ${it.application ? `<div class="block application"><span class="tag">Be ready</span><p>${esc(it.application)}</p></div>` : hope()}
  <div class="center" style="margin:20px 0">${scriptureBlock(closing)}</div>
  <h3>Sources</h3>
  <div class="src">${srcs.map(x => `<p class="muted"><strong>${esc(x.publisher)}</strong> - <a href="${esc(safeUrl(x.canonical_url))}" target="_blank" rel="noopener">${esc(x.title)}</a>${x.published_at ? " (" + dateStr(x.published_at) + ")" : ""}</p>`).join("")}</div>
  ${shareBtn(it.headline, url)}
  <details><summary class="dim" style="cursor:pointer">Report a correction on this item</summary>
    <form onsubmit="return sendInbox(event,'correction')"><input type="hidden" name="item_id" value="${it.id}"><textarea name="body" rows="4" placeholder="What is wrong, and where can we check it?" required aria-label="Correction"></textarea><input type="email" name="email" placeholder="Your email (optional, if you want a reply)" aria-label="Email"><input class="hp" name="website" tabindex="-1" autocomplete="off"><button class="primary" type="submit">Send to the editor</button><p class="ok" data-ok hidden>Received. Thank you. It goes to the editor only.</p></form>
  </details>
  <p class="dim">${esc(s("grade_key"))}</p>`;
}

async function watch(id){
  const themes = await q("themes?order=position&select=*");
  if(id){
    const t = themes.find(x => x.id === id); if(!t) return watch();
    const items = await q(`items?theme_id=eq.${id}&status=in.(app_published,retracted)&order=graded_at.desc&select=id,headline,grade,graded_at,status`);
    const refs = t.passage.split(";").map(x => x.trim());
    const blocks = []; for(const r of refs){ blocks.push(scriptureBlock(await verses(r))); }
    return `<a href="#watch" class="dim" style="text-decoration:none">&larr; What we watch</a>
    <h1 style="margin-top:10px">${esc(t.label)}</h1>
    ${t.kind === "study" ? `<p class="dim">Study only. No news items are graded under this passage.</p>` : (t.max_grade && t.max_grade !== "A" ? `<p class="dim">Items here are never graded above ${esc(GRADE[t.max_grade][0])}.</p>` : "")}
    ${blocks.join("")}
    <div class="block"><span class="tag">In context</span><p>${await refLinkify(t.context_note)}</p></div>
    ${t.kind === "watch" ? `<div class="block"><span class="tag">What counts</span><p>${await refLinkify(t.what_counts)}</p></div>` : `<div class="block"><span class="tag">For study</span><p>${await refLinkify(t.what_counts)}</p></div>`}
    <div class="block"><span class="tag">What does not</span><p>${await refLinkify(t.what_does_not)}</p></div>
    ${t.stated_position ? `<div class="block position"><span class="tag">This app's position</span><p>${await refLinkify(t.stated_position)}</p></div>` : ""}
    ${t.study_page ? `<div class="card"><div class="tag">Study notes</div><p style="margin:6px 0 0">${await refLinkify(t.study_page)}</p></div>` : ""}
    ${t.card_line ? `<p class="dim">${esc(t.card_line)}</p>` : ""}
    <h2>History</h2>
    ${items.length ? `<div class="list">${items.map(i => `<a href="#item-${i.id}"><strong>${esc(i.headline)}</strong><small>${dateStr(i.graded_at)} · ${i.grade ? GRADE[i.grade][0] : "Study"}${i.status==="retracted" ? " · Retracted" : ""}</small></a>`).join("")}</div>` : `<p class="muted">No items yet under this passage.</p>`}
    ${hope()}`;
  }
  const w = themes.filter(t => t.kind === "watch"), st = themes.filter(t => t.kind === "study");
  return `<h1>What we watch</h1><p class="muted">Thirteen passages. Each one says what counts, what does not, and where this app stands. These are categories for study, not a timeline, and the number of them says nothing about when (Matthew 24:36).</p>
  <p class="dim">Matthew 24 was spoken about the temple standing in front of the disciples, and much of it was fulfilled in AD 70 on many readings (see Luke 21:20). This app reads it as also pointing to the end of the age. We tell you the other reading exists so you can test ours.</p>
  <div class="list">${w.map(t => `<a href="#watch-${t.id}"><strong>${esc(t.label)}</strong><small>${esc(t.passage)}</small></a>`).join("")}</div>
  <h2>For study only</h2>
  <div class="list">${st.map(t => `<a href="#watch-${t.id}"><strong>${esc(t.label)}</strong><small>${esc(t.passage)}</small></a>`).join("")}</div>
  <div class="block"><span class="tag">Rules that never bend</span><p>${esc(s("hard_blocks"))}</p></div>`;
}

async function study(slug){
  const pages = await q("pages?section=eq.study&order=position&select=slug,title,body");
  if(slug){
    const p = pages.find(x => x.slug === slug); if(!p) return study();
    return `<a href="#study" class="dim" style="text-decoration:none">&larr; Study</a><h1 style="margin-top:10px">${esc(p.title)}</h1>${await renderBody(p.body)}${shareBtn(p.title, BASE + "#study-" + p.slug)}`;
  }
  const teach = await q("teachings?status=eq.published&order=published_at.desc&limit=5&select=id,title,passage,published_at");
  return `<h1>Study</h1><p class="muted">The pages that hold this app up. Start with the first one.</p>
  <div class="list">${pages.map(p => `<a href="#study-${p.slug}"><strong>${esc(p.title)}</strong></a>`).join("")}</div>
  ${teach.length ? `<h2>Teachings</h2><div class="list">${teach.map(t => `<a href="#teaching-${t.id}"><strong>${esc(t.title)}</strong><small>${esc(t.passage)} · ${dateStr(t.published_at)}</small></a>`).join("")}</div>` : ""}`;
}

async function teaching(id){
  const r = await q(`teachings?id=eq.${id}&status=eq.published&select=*`);
  if(!r.length) return study();
  const t = r[0]; const ps = await verses(t.passage);
  return `<a href="#study" class="dim" style="text-decoration:none">&larr; Study</a><h1 style="margin-top:10px">${esc(t.title)}</h1><div class="dim">${dateStr(t.published_at)} · from the editor</div>${scriptureBlock(ps)}${await renderBody(t.body)}${t.media_url ? `<p><a href="${esc(safeUrl(t.media_url))}" target="_blank" rel="noopener">Listen or watch</a></p>` : ""}<p class="dim">A teaching from the editor of Lamps Trimmed. Test it against the Word.</p>${shareBtn(t.title, BASE + "#teaching-" + t.id)}`;
}

async function bible(bookId, chapter, verse){
  const books = await getBooks();
  bookId = +bookId || 40; chapter = +chapter || 24; verse = +verse || 0;
  const b = books.find(x => x.id === bookId) || books[0];
  const vs = await q(`verses?translation=eq.KJV&book_id=eq.${b.id}&chapter=eq.${chapter}&order=verse&select=verse,text`);
  const chapters = Array.from({length:b.chapters},(_,i)=>i+1);
  return `<h1>${esc(b.name)} ${chapter}</h1>
  <form class="sel" onsubmit="return jumpRef(event)"><input name="ref" placeholder="Go to a reference, e.g. Luke 12:35" aria-label="Reference" style="flex:1"><button class="ghost" type="submit">Go</button></form>
  <div class="sel"><select id="bsel" aria-label="Book">${books.map(x => `<option value="${x.id}" ${x.id===b.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select><select id="csel" aria-label="Chapter">${chapters.map(c => `<option ${c===chapter?"selected":""}>${c}</option>`).join("")}</select></div>
  ${vs.map(v => `<div class="v ${v.verse===verse?"hl":""}" id="v${v.verse}"><b>${v.verse}</b><span>${esc(v.text)}</span></div>`).join("")}
  <div class="sel" style="margin-top:22px">${chapter>1 ? `<button class="ghost" onclick="location.hash='#bible-${b.id}-${chapter-1}'">&larr; Chapter ${chapter-1}</button>` : ""}${chapter<b.chapters ? `<button class="ghost" onclick="location.hash='#bible-${b.id}-${chapter+1}'" style="margin-left:auto">Chapter ${chapter+1} &rarr;</button>` : ""}</div>
  <p class="dim">King James Version. Public domain. Stored once, locked, never edited in this app. <a href="#about-why-kjv">Why the KJV</a></p>`;
}
window.jumpRef = async (e) => { e.preventDefault(); await getBooks(); const p = parseRef(e.target.ref.value); if(p) location.hash = `#bible-${p.book.id}-${p.c1}-${p.v1}`; else alertInline(e.target, "Try the form Book Chapter:Verse, like John 3:16."); return false; };

async function about(slug){
  const pages = await q("pages?section=eq.about&order=position&select=slug,title,body");
  if(slug){
    const p = pages.find(x => x.slug === slug); if(!p) return about();
    const extra = slug === "corrections" ? `<form onsubmit="return sendInbox(event,'correction')"><textarea name="body" rows="4" placeholder="What is wrong, and where can we check it?" required aria-label="Correction"></textarea><input type="email" name="email" placeholder="Your email (optional)" aria-label="Email"><input class="hp" name="website" tabindex="-1" autocomplete="off"><button class="primary" type="submit">Send to the editor</button><p class="ok" data-ok hidden>Received. Thank you.</p></form>` : "";
    return `<a href="#about" class="dim" style="text-decoration:none">&larr; About</a><h1 style="margin-top:10px">${esc(p.title)}</h1>${await renderBody(p.body)}${extra}`;
  }
  const r = await verses("Revelation 22:20");
  return `<h1>About</h1><p class="big">${esc(s("about"))}</p>
  <div class="list">${pages.map(p => `<a href="#about-${p.slug}"><strong>${esc(p.title)}</strong></a>`).join("")}<a href="#study-why-we-watch"><strong>Why we watch. Why we never set dates.</strong></a></div>
  <h2>Ask the editor</h2><p class="muted">Questions come to the editor only. Nothing is posted publicly. Good questions may become a teaching.</p>
  <form onsubmit="return sendInbox(event,'question')"><textarea name="body" rows="4" placeholder="Your question" required aria-label="Question"></textarea><input type="email" name="email" placeholder="Your email (optional)" aria-label="Email"><input class="hp" name="website" tabindex="-1" autocomplete="off"><button class="primary" type="submit">Send</button><p class="ok" data-ok hidden>Received. Thank you.</p></form>
  <h3>Keep the lamp lit</h3><p class="muted">Everything here is free and will stay free. A way to support the work is coming.</p>
  <div class="center" style="margin-top:28px">${scriptureBlock(r)}</div>`;
}

// ---------- router ----------
async function render(){
  const h = (location.hash || "#home").slice(1);
  const [view, ...rest] = h.split("-");
  const main = document.getElementById("main");
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + view));
  main.innerHTML = `<div class="empty">Loading</div>`;
  try{
    let html;
    if(view === "home") html = await home();
    else if(view === "today") html = await today();
    else if(view === "item") html = await itemPage(rest.join("-"));
    else if(view === "watch") html = await watch(rest.join("-"));
    else if(view === "study") html = await study(rest.join("-"));
    else if(view === "teaching") html = await teaching(rest.join("-"));
    else if(view === "bible") html = await bible(rest[0], rest[1], rest[2]);
    else if(view === "about") html = await about(rest.join("-"));
    else html = await home();
    main.innerHTML = html + `<div class="foot">${esc(s("app_name"))} · We watch the season. We never set dates. · <a href="#about-privacy">Privacy</a></div>`;
    const hl = main.querySelector(".v.hl"); if(hl) hl.scrollIntoView({block:"center"}); else window.scrollTo(0,0);
    main.focus({preventScroll:true});
    const bs = document.getElementById("bsel"), cs = document.getElementById("csel");
    if(bs) bs.onchange = () => location.hash = `#bible-${bs.value}-1`;
    if(cs) cs.onchange = () => location.hash = `#bible-${bs.value}-${cs.value}`;
  }catch(e){
    main.innerHTML = `<div class="empty">${esc(e.message || "Something did not load.")} <br><button class="ghost" onclick="render()" style="margin-top:12px">Try again</button></div>`;
  }
}
(async () => {
  try{
    const rows = await q("settings?select=key,value");
    SETTINGS = Object.fromEntries(rows.map(r => [r.key, r.value]));
    if(s("test_mode") === "true") document.getElementById("testbadge").hidden = false;
  }catch(e){ document.getElementById("main").innerHTML = `<div class="empty">We could not reach the database just now. <br><button class="ghost" onclick="location.reload()" style="margin-top:12px">Try again</button></div>`; return; }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
